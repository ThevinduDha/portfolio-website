<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="agriBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061c14" />
      <stop offset="50%" stop-color="#0a2a1d" />
      <stop offset="100%" stop-color="#04120d" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#agriBg)"/>
  
  <!-- Subtle Grid lines -->
  <g opacity="0.15" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Radar circles on right -->
  <circle cx="560" cy="225" r="140" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="560" cy="225" r="95" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="560" cy="225" r="45" stroke="#10b981" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="560" cy="225" r="6" fill="#34d399" filter="url(#glowGreen)"/>

  <!-- Scanning beam -->
  <path d="M560 225 L680 140 A140 140 0 0 0 560 85 Z" fill="url(#radarGrad)" opacity="0.6"/>

  <!-- Mock Leaf Detection Card -->
  <rect x="70" y="80" width="340" height="290" rx="12" fill="#0c1e17" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="70" y="80" width="340" height="42" rx="12" fill="#132c22"/>
  <circle cx="95" cy="101" r="5" fill="#ef4444"/>
  <circle cx="112" cy="101" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="101" r="5" fill="#10b981"/>
  <text x="155" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AgriShield AI // Disease Classifier</text>

  <!-- Leaf Shape in Card -->
  <path d="M190 270 C160 230 150 170 210 140 C270 170 260 230 230 270 C220 285 200 285 190 270 Z" fill="url(#leafGrad)" opacity="0.85"/>
  <path d="M210 155 Q210 210 210 275" stroke="#042f20" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Bounding box overlay -->
  <rect x="150" y="135" width="120" height="150" rx="6" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" filter="url(#glowGreen)"/>
  <rect x="150" y="120" width="110" height="20" rx="4" fill="#10b981"/>
  <text x="156" y="134" fill="#042f20" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Early Blight 98.4%</text>

  <!-- Stats Pills on Card -->
  <rect x="290" y="145" width="105" height="45" rx="8" fill="#102d21" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="300" y="163" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">EfficientNet-B0</text>
  <text x="300" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">20K+ Images</text>

  <rect x="290" y="200" width="105" height="45" rx="8" fill="#102d21" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="300" y="218" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">Severity HSV</text>
  <text x="300" y="235" fill="#facc15" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Stage II (Mod)</text>

  <rect x="290" y="255" width="105" height="45" rx="8" fill="#102d21" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="300" y="273" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">Gemini Advisory</text>
  <text x="300" y="290" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">EN / SI / TA</text>

  <!-- Map hotspots -->
  <circle cx="510" cy="180" r="10" fill="#ef4444" fill-opacity="0.3"/>
  <circle cx="510" cy="180" r="4" fill="#ef4444"/>
  <circle cx="620" cy="260" r="12" fill="#f59e0b" fill-opacity="0.3"/>
  <circle cx="620" cy="260" r="5" fill="#f59e0b"/>
  <circle cx="580" cy="310" r="8" fill="#10b981" fill-opacity="0.3"/>
  <circle cx="580" cy="310" r="3" fill="#10b981"/>

  <!-- Badge at bottom right -->
  <rect x="475" y="370" width="245" height="34" rx="17" fill="#0c231a" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="495" y="392" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Geospatial Risk Map &amp; Weather Alert</text>
</svg>
