<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#0f213f" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#dwBg)"/>

  <!-- Star Schema Node Visual on Left -->
  <!-- Fact Table Center -->
  <rect x="70" y="190" width="130" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glowBlue)"/>
  <text x="85" y="220" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">FACT_SALES</text>
  <text x="85" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">99,000+ Records</text>

  <!-- Dimension tables surrounding -->
  <!-- Dim Customer (Top) -->
  <rect x="70" y="80" width="130" height="45" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="85" y="107" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DIM_CUSTOMER</text>
  <line x1="135" y1="125" x2="135" y2="190" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Dim Product (Bottom) -->
  <rect x="70" y="325" width="130" height="45" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="85" y="352" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DIM_PRODUCT</text>
  <line x1="135" y1="260" x2="135" y2="325" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Dim Date (Far Left) -->
  <line x1="70" y1="225" x2="40" y2="225" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- ETL Arrow to DW -->
  <g transform="translate(225, 210)">
    <circle cx="20" cy="15" r="18" fill="#0369a1"/>
    <text x="9" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ETL</text>
    <path d="M45 15 L75 15 M65 8 L75 15 L65 22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Power BI Analytics Dashboard Window on Right -->
  <rect x="330" y="70" width="410" height="310" rx="14" fill="#0b172a" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="330" y="70" width="410" height="42" rx="14" fill="#13233f"/>
  <circle cx="355" cy="91" r="5" fill="#ef4444"/>
  <circle cx="372" cy="91" r="5" fill="#f59e0b"/>
  <circle cx="389" cy="91" r="5" fill="#10b981"/>
  <text x="410" y="96" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Olist E-Commerce Analytics // Power BI</text>

  <!-- KPI Metric Cards inside Power BI -->
  <rect x="355" y="125" width="115" height="55" rx="8" fill="#112444" stroke="#1e3a6a" stroke-width="1"/>
  <text x="367" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Total Revenue</text>
  <text x="367" y="167" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">$16.2M</text>

  <rect x="480" y="125" width="115" height="55" rx="8" fill="#112444" stroke="#1e3a6a" stroke-width="1"/>
  <text x="492" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Transactions</text>
  <text x="492" y="167" fill="#facc15" font-family="system-ui, sans-serif" font-size="14" font-weight="700">99,441</text>

  <rect x="605" y="125" width="115" height="55" rx="8" fill="#112444" stroke="#1e3a6a" stroke-width="1"/>
  <text x="617" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Avg Review</text>
  <text x="617" y="167" fill="#4ade80" font-family="system-ui, sans-serif" font-size="14" font-weight="700">4.18 ★</text>

  <!-- Mini Chart inside -->
  <rect x="355" y="195" width="220" height="160" rx="8" fill="#112444"/>
  <text x="370" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Monthly Sales Volume (DAX)</text>
  <!-- Bars -->
  <rect x="375" y="290" width="14" height="45" rx="3" fill="url(#barGrad)"/>
  <rect x="395" y="270" width="14" height="65" rx="3" fill="url(#barGrad)"/>
  <rect x="415" y="250" width="14" height="85" rx="3" fill="url(#barGrad)"/>
  <rect x="435" y="280" width="14" height="55" rx="3" fill="url(#barGrad)"/>
  <rect x="455" y="240" width="14" height="95" rx="3" fill="url(#barGrad)"/>
  <rect x="475" y="230" width="14" height="105" rx="3" fill="url(#barGrad)"/>
  <rect x="495" y="255" width="14" height="80" rx="3" fill="url(#barGrad)"/>
  <rect x="515" y="220" width="14" height="115" rx="3" fill="url(#barGrad)"/>
  <rect x="535" y="245" width="14" height="90" rx="3" fill="url(#barGrad)"/>

  <!-- Donut / Category Card -->
  <rect x="590" y="195" width="130" height="160" rx="8" fill="#112444"/>
  <text x="600" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Customer Segments</text>
  <circle cx="655" cy="275" r="40" stroke="#0284c7" stroke-width="12" fill="none"/>
  <circle cx="655" cy="275" r="40" stroke="#f59e0b" stroke-width="12" stroke-dasharray="75 180" fill="none"/>
  <text x="643" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">72%</text>

  <!-- Tag Pill -->
  <rect x="470" y="390" width="270" height="34" rx="17" fill="#13233f" stroke="#0284c7" stroke-opacity="0.5"/>
  <text x="490" y="412" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SSIS ETL • SQL Server • Star Schema • DAX</text>
</svg>
