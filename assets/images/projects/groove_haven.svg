<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="musicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190721" />
      <stop offset="50%" stop-color="#2a0c36" />
      <stop offset="100%" stop-color="#0e0413" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#musicBg)"/>

  <!-- Left: Custom Player Card -->
  <rect x="70" y="70" width="370" height="310" rx="14" fill="#200a29" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="70" y="70" width="370" height="42" rx="14" fill="#321040"/>
  <circle cx="95" cy="91" r="5" fill="#ef4444"/>
  <circle cx="112" cy="91" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="91" r="5" fill="#10b981"/>
  <text x="145" y="96" fill="#fce7f3" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Groove Haven // Audio Streaming Engine</text>

  <!-- Album Art & Track Info -->
  <rect x="95" y="130" width="80" height="80" rx="10" fill="url(#neonPink)"/>
  <circle cx="135" cy="170" r="24" fill="#000000" fill-opacity="0.3"/>
  <circle cx="135" cy="170" r="8" fill="#ffffff"/>

  <text x="190" y="155" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Midnight Neon Synth</text>
  <text x="190" y="175" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11">Thevindu Dha (Artist Showcase)</text>
  <rect x="190" y="185" width="70" height="20" rx="4" fill="#ec4899" fill-opacity="0.2"/>
  <text x="197" y="198" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="9" font-weight="700">FLAC 24-BIT</text>

  <!-- Waveform Visualizer -->
  <g fill="#ec4899" filter="url(#glowPink)">
    <rect x="95" y="240" width="5" height="25" rx="2.5"/>
    <rect x="105" y="230" width="5" height="45" rx="2.5"/>
    <rect x="115" y="225" width="5" height="55" rx="2.5"/>
    <rect x="125" y="242" width="5" height="20" rx="2.5"/>
    <rect x="135" y="220" width="5" height="65" rx="2.5"/>
    <rect x="145" y="235" width="5" height="35" rx="2.5"/>
    <rect x="155" y="215" width="5" height="75" rx="2.5"/>
    <rect x="165" y="230" width="5" height="45" rx="2.5"/>
    <rect x="175" y="245" width="5" height="15" rx="2.5"/>
    <rect x="185" y="222" width="5" height="60" rx="2.5"/>
    <rect x="195" y="210" width="5" height="85" rx="2.5"/>
    <rect x="205" y="228" width="5" height="50" rx="2.5"/>
    <rect x="215" y="240" width="5" height="25" rx="2.5"/>
    <rect x="225" y="218" width="5" height="70" rx="2.5"/>
    <rect x="235" y="233" width="5" height="40" rx="2.5"/>
    <rect x="245" y="225" width="5" height="55" rx="2.5"/>
    <rect x="255" y="242" width="5" height="20" rx="2.5"/>
    <rect x="265" y="212" width="5" height="80" rx="2.5"/>
    <rect x="275" y="230" width="5" height="45" rx="2.5"/>
    <rect x="285" y="246" width="5" height="12" rx="2.5"/>
    <rect x="295" y="220" width="5" height="65" rx="2.5"/>
    <rect x="305" y="238" width="5" height="30" rx="2.5"/>
    <rect x="315" y="216" width="5" height="72" rx="2.5"/>
    <rect x="325" y="228" width="5" height="48" rx="2.5"/>
    <rect x="335" y="244" width="5" height="16" rx="2.5"/>
    <rect x="345" y="222" width="5" height="60" rx="2.5"/>
    <rect x="355" y="235" width="5" height="35" rx="2.5"/>
    <rect x="365" y="228" width="5" height="48" rx="2.5"/>
    <rect x="375" y="240" width="5" height="24" rx="2.5"/>
    <rect x="385" y="232" width="5" height="40" rx="2.5"/>
    <rect x="395" y="245" width="5" height="15" rx="2.5"/>
  </g>

  <!-- Player Controls Bar -->
  <line x1="95" y1="315" x2="415" y2="315" stroke="#f472b6" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="315" x2="260" y2="315" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <circle cx="260" cy="315" r="6" fill="#ffffff" filter="url(#glowPink)"/>
  
  <text x="95" y="335" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10">02:14</text>
  <text x="390" y="335" fill="#9d4edd" font-family="system-ui, sans-serif" font-size="10">04:30</text>

  <!-- Right: Social & Artist Analytics Card -->
  <rect x="470" y="70" width="270" height="310" rx="14" fill="#200a29" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="470" y="70" width="270" height="42" rx="14" fill="#321040"/>
  <text x="495" y="96" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Artist Analytics &amp; Social</text>

  <!-- Metric 1 -->
  <rect x="490" y="130" width="230" height="55" rx="8" fill="#2d0f3a"/>
  <text x="505" y="152" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10">Total Stream Plays</text>
  <text x="505" y="174" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="16" font-weight="700">128,420 Streams</text>

  <!-- Social Comments Feed -->
  <rect x="490" y="200" width="230" height="155" rx="8" fill="#2d0f3a"/>
  <text x="505" y="222" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Real-Time Community Feedback</text>
  
  <rect x="505" y="235" width="200" height="45" rx="6" fill="#3b154c"/>
  <text x="515" y="252" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10" font-weight="600">@music_lover_99</text>
  <text x="515" y="268" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">The bass drop is incredible! 🔥</text>

  <rect x="505" y="290" width="200" height="45" rx="6" fill="#3b154c"/>
  <text x="515" y="307" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10" font-weight="600">@indie_fan</text>
  <text x="515" y="323" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Spring Boot backend is so smooth!</text>

  <!-- Tag Pill -->
  <rect x="440" y="395" width="300" height="34" rx="17" fill="#321040" stroke="#f43f5e" stroke-opacity="0.5"/>
  <text x="460" y="417" fill="#fce7f3" font-family="system-ui, sans-serif" font-size="11" font-weight="600">React Vite • Spring Boot • Hibernate • MySQL</text>
</svg>
