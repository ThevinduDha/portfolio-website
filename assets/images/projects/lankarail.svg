  <text x="180" y="333" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Instant PDF E-Ticket Generated 🎫</text>

  <!-- Right: Digital E-Ticket Mockup -->
  <rect x="470" y="70" width="270" height="310" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="470" y="70" width="270" height="60" rx="14" fill="#0369a1"/>
  <text x="495" y="98" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">SRI LANKA RAILWAYS</text>
  <text x="495" y="115" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10">Electronic Passenger Ticket</text>

  <text x="495" y="155" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Passenger Name</text>
  <text x="495" y="172" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">THEVINDU DHARMADASA</text>

  <text x="495" y="200" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Train / Carriage / Seat</text>
  <text x="495" y="217" fill="#0369a1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1005 Podi Menike • Car 3 • S24</text>

  <!-- Mock QR Barcode -->
  <rect x="495" y="240" width="220" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <g fill="#1e293b">
    <rect x="505" y="248" width="6" height="34"/>
    <rect x="515" y="248" width="3" height="34"/>
    <rect x="522" y="248" width="8" height="34"/>
    <rect x="534" y="248" width="4" height="34"/>
    <rect x="542" y="248" width="10" height="34"/>
    <rect x="556" y="248" width="5" height="34"/>
    <rect x="565" y="248" width="8" height="34"/>
    <rect x="577" y="248" width="3" height="34"/>
    <rect x="584" y="248" width="6" height="34"/>
    <rect x="594" y="248" width="9" height="34"/>
    <rect x="607" y="248" width="4" height="34"/>
    <rect x="615" y="248" width="8" height="34"/>
    <rect x="627" y="248" width="4" height="34"/>
    <rect x="635" y="248" width="10" height="34"/>
    <rect x="649" y="248" width="5" height="34"/>
    <rect x="658" y="248" width="7" height="34"/>
    <rect x="669" y="248" width="4" height="34"/>
    <rect x="677" y="248" width="6" height="34"/>
    <rect x="687" y="248" width="8" height="34"/>
    <rect x="699" y="248" width="4" height="34"/>
  </g>
  <text x="560" y="304" fill="#64748b" font-family="monospace" font-size="9">LR-2026-9812-OK</text>

  <rect x="495" y="325" width="220" height="35" rx="6" fill="#0f172a"/>
  <text x="525" y="347" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Validated via Spring Boot</text>

  <!-- Tag Pill -->
  <rect x="440" y="395" width="300" height="34" rx="17" fill="#132a42" stroke="#0284c7" stroke-opacity="0.5"/>
  <text x="460" y="417" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Java Spring Boot • MySQL • JWT • REST APIs</text>
