<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="restockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181309" />
      <stop offset="50%" stop-color="#261b0c" />
      <stop offset="100%" stop-color="#0f0c05" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#restockBg)"/>

  <!-- Left: Inventory Stock Monitoring Dashboard Card -->
  <rect x="70" y="70" width="370" height="310" rx="14" fill="#1c160e" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="70" y="70" width="370" height="42" rx="14" fill="#291e12"/>
  <circle cx="95" cy="91" r="5" fill="#ef4444"/>
  <circle cx="112" cy="91" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="91" r="5" fill="#10b981"/>
  <text x="145" y="96" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Smart Inventory // ML Stock Prediction</text>

  <!-- Restock Alert Row 1 -->
  <rect x="95" y="130" width="320" height="55" rx="8" fill="#2d1f11" stroke="#ef4444" stroke-width="1.2"/>
  <circle cx="115" cy="157" r="7" fill="#ef4444"/>
  <text x="135" y="152" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">UltraTech Cement 50kg</text>
  <text x="135" y="170" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10">Stock: 12 bags | Threshold: 100 bags</text>
  <rect x="310" y="142" width="90" height="30" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="323" y="162" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700">RESTOCK NOW</text>

  <!-- Restock Alert Row 2 -->
  <rect x="95" y="195" width="320" height="55" rx="8" fill="#261b0f" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="115" cy="222" r="7" fill="#f59e0b"/>
  <text x="135" y="217" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">GI Steel Pipe 1.5"</text>
  <text x="135" y="235" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10">Stock: 45 units | Predicted Out in 4 Days</text>
  <rect x="310" y="207" width="90" height="30" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="328" y="227" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">REORDER</text>

  <!-- Live Sales Sync / Promotion Banner inside -->
  <rect x="95" y="260" width="320" height="100" rx="8" fill="#1b241c" stroke="#10b981" stroke-width="1"/>
  <text x="115" y="285" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Discounts &amp; Promotion Engine + PayHere</text>
  <text x="115" y="307" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="10">Active Campaign: Sinhala New Year Flash Deals (-15%)</text>
  <rect x="115" y="322" width="130" height="24" rx="4" fill="#047857"/>
  <text x="127" y="338" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Syncs Spring Boot API</text>

  <!-- Right: ML Forecast Curve Card -->
  <rect x="470" y="70" width="270" height="310" rx="14" fill="#1c160e" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="470" y="70" width="270" height="42" rx="14" fill="#291e12"/>
  <text x="495" y="96" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">XGBoost &amp; Scikit-learn</text>

  <!-- Forecast chart lines -->
  <path d="M495 280 Q540 250 580 200 T650 140 T710 180" stroke="#f59e0b" stroke-width="3" fill="none" filter="url(#glowAmber)"/>
  <path d="M495 250 Q540 220 580 260 T650 200 T710 150" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  
  <circle cx="650" cy="140" r="6" fill="#f59e0b"/>
  <rect x="615" y="105" width="85" height="26" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="625" y="122" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">+350 Units Qty</text>

  <!-- Metrics on bottom of right card -->
  <rect x="490" y="305" width="230" height="55" rx="8" fill="#261b0f"/>
  <text x="505" y="325" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10">Model Pipeline</text>
  <text x="505" y="344" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Dual Classifier + Regressor (Joblib)</text>

  <!-- Tag Pill -->
  <rect x="440" y="395" width="300" height="34" rx="17" fill="#291e12" stroke="#d97706" stroke-opacity="0.5"/>
  <text x="455" y="417" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Java Spring Boot • XGBoost • PayHere • MySQL</text>
</svg>
