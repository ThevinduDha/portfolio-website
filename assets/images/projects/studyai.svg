<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="studyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d29" />
      <stop offset="50%" stop-color="#18133b" />
      <stop offset="100%" stop-color="#0b081b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#studyBg)"/>

  <!-- Network / RAG Nodes -->
  <g opacity="0.3" stroke="#8b5cf6" stroke-width="1.5">
    <line x1="520" y1="120" x2="620" y2="160" />
    <line x1="620" y1="160" x2="700" y2="110" />
    <line x1="620" y1="160" x2="640" y2="260" />
    <line x1="520" y1="120" x2="490" y2="230" />
    <line x1="490" y1="230" x2="570" y2="300" />
    <line x1="640" y1="260" x2="570" y2="300" />
    <line x1="640" y1="260" x2="730" y2="280" />
  </g>

  <!-- Nodes -->
  <circle cx="520" cy="120" r="14" fill="#6d28d9" stroke="#c084fc" stroke-width="2"/>
  <circle cx="620" cy="160" r="22" fill="#7c3aed" stroke="#a855f7" stroke-width="3" filter="url(#glowPurple)"/>
  <circle cx="700" cy="110" r="12" fill="#4c1d95" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="490" cy="230" r="16" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
  <circle cx="640" cy="260" r="18" fill="#6d28d9" stroke="#c084fc" stroke-width="2"/>
  <circle cx="570" cy="300" r="14" fill="#4c1d95" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="730" cy="280" r="15" fill="#7c3aed" stroke="#c084fc" stroke-width="2"/>

  <!-- Vector Label -->
  <rect x="545" y="148" width="150" height="24" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="560" y="164" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cosine Similarity 0.94</text>

  <!-- Flashcard UI Panel on Left -->
  <rect x="70" y="70" width="360" height="300" rx="14" fill="#17113a" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="70" y="70" width="360" height="42" rx="14" fill="#221a4f"/>
  <circle cx="95" cy="91" r="5" fill="#ef4444"/>
  <circle cx="112" cy="91" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="91" r="5" fill="#10b981"/>
  <text x="150" y="96" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">StudyAI // RAG Document Engine</text>

  <!-- Question Card inside -->
  <rect x="95" y="130" width="310" height="110" rx="10" fill="#20184c" stroke="#6366f1" stroke-opacity="0.3"/>
  <rect x="110" y="145" width="60" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.25"/>
  <text x="118" y="159" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">MCQ #04</text>
  <text x="110" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Which vector embedding model is used?</text>
  <text x="110" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Google text-embedding-004 + Gemini API</text>

  <!-- Source citation pill -->
  <rect x="95" y="255" width="310" height="40" rx="8" fill="#130e2f" stroke="#10b981" stroke-opacity="0.4"/>
  <circle cx="115" cy="275" r="4" fill="#10b981"/>
  <text x="130" y="279" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Verified Academic Source [Doc_Chunk_42]</text>

  <rect x="95" y="308" width="145" height="40" rx="8" fill="url(#purpleGrad)"/>
  <text x="122" y="333" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Generate Quiz</text>

  <rect x="250" y="308" width="155" height="40" rx="8" fill="#241b55" stroke="#8b5cf6" stroke-opacity="0.4"/>
  <text x="275" y="333" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Semantic Search</text>

  <!-- Tag at bottom right -->
  <rect x="500" y="380" width="230" height="34" rx="17" fill="#1b123d" stroke="#8b5cf6" stroke-opacity="0.5"/>
  <text x="520" y="402" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MERN Stack • RAG • Gemini 1.5</text>
</svg>
